name: Auto Changelog & Release

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'Installer/Payload/version.json'
      - 'PilotsDock-Installer-latest.exe'

permissions:
  contents: write

concurrency:
  group: pilotsdock-latest-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-changelog-and-release:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up jq
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      # 1 Read version + timestamp
      - name: Read version.json
        id: version
        run: |
          RAW_VERSION=$(jq -er '.Version | select(type == "string" and length > 0) | select(test("^[v]?[0-9]+[.][0-9]+[.][0-9]+[^\\r\\n]*$"))' Installer/Payload/version.json)
          TIMESTAMP=$(jq -er '.Timestamp | select(type == "string") | select(test("^[0-9]{4}[.][0-9]{2}[.][0-9]{2}[.][0-9]{4}$"))' Installer/Payload/version.json)
          # Preserve the project's existing three-component display version.
          CLEAN_VERSION=$(echo "$RAW_VERSION" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')

          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      # 2 Detect version change (Git-based)
      - name: Detect version change
        id: version_check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          CURRENT=$(jq -er '.Version' Installer/Payload/version.json)
          BASE="$BEFORE"
          # Manual runs and new branches have no push-before commit.
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
            BASE=$(git rev-parse --verify HEAD^ 2>/dev/null || true)
          fi
          PREVIOUS=""
          if [ -n "$BASE" ]; then
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$BASE"
            fi
            if git cat-file -e "$BASE:Installer/Payload/version.json" 2>/dev/null; then
              PREVIOUS=$(git show "$BASE:Installer/Payload/version.json" | jq -er '.Version | select(type == "string" and length > 0)')
            fi
          fi

          echo "Current version: $CURRENT"
          echo "Previous version: $PREVIOUS"

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      
      # 3 Read CHANGES
      - name: Read changes content
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-changes.md"
          if [ -s CHANGES.md ]; then
            cp CHANGES.md "$NOTES_FILE"
          else
            : > "$NOTES_FILE"
            # Recover notes when retrying after CHANGES has already been cleared.
            if [ -f CHANGELOG.md ]; then
              awk -v heading="## v$VERSION" '
                { sub(/\r$/, "") }
                $0 == heading { found = 1; next }
                found && /^## / { exit }
                found { print }
              ' CHANGELOG.md > "$NOTES_FILE"
            fi
            if ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
              printf '%s\n' '- No changes recorded' > "$NOTES_FILE"
            fi
          fi

      # 4 Update CHANGELOG ONLY on version change
      - name: Update CHANGELOG
        id: update_changelog
        if: steps.version_check.outputs.changed == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Ensure CHANGELOG exists with header
          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          VERSION="v$RELEASE_VERSION"

          # Prevent duplicate entries
          if grep -Fqx -- "## $VERSION" CHANGELOG.md; then
            echo "Version already exists — skipping"
            exit 0
          fi

          # Ensure header stays at top, then prepend new entry
          {
            printf '# Changelog\n\n## %s\n\n' "$VERSION"
            cat "$RUNNER_TEMP/release-changes.md"
            printf '\n\n<br/><br/>\n\n'
            awk 'NR == 1 && /^# Changelog\r?$/ { next } { print }' CHANGELOG.md
          } > CHANGELOG.tmp.md

          mv CHANGELOG.tmp.md CHANGELOG.md

          # Clear input AFTER use
          : > CHANGES.md
          echo "updated=true" >> "$GITHUB_OUTPUT"

      # 6 VirusTotal Check
      - name: Upload to VirusTotal
        id: vt_upload
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          FILE="PilotsDock-Installer-latest.exe"

          if [ ! -s "$FILE" ]; then
            echo "::error::Installer missing or empty: $FILE"
            exit 1
          fi

          if [ -z "$VT_API_KEY" ]; then
            echo "::error::VT_API_KEY is not configured"
            exit 1
          fi

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 180 \
            --request POST \
            --url "https://www.virustotal.com/api/v3/files" \
            --header "x-apikey: $VT_API_KEY" \
            --form "file=@${FILE}")

          ANALYSIS_ID=$(printf '%s' "$RESPONSE" | jq -er '.data | select(.type == "analysis") | .id | select(type == "string" and length > 0) | select(test("[\\r\\n]") | not)')

          if [ -z "$ANALYSIS_ID" ] || [ "$ANALYSIS_ID" = "null" ]; then
            echo "::error::VirusTotal did not return an analysis ID"
            exit 1
          fi

          echo "analysis_id=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for VirusTotal analysis
        run: sleep 60

      - name: Poll VirusTotal analysis
        id: vt_report
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ANALYSIS_ID: ${{ steps.vt_upload.outputs.analysis_id }}
        run: |
          ENCODED_ID=$(jq -rn --arg id "$ANALYSIS_ID" '$id | @uri')
          EXPECTED_SHA256=$(sha256sum PilotsDock-Installer-latest.exe | cut -d ' ' -f 1)

          for i in {1..10}; do
            echo "Checking VirusTotal status (attempt $i)..."

            RESPONSE=$(curl --fail-with-body --silent --show-error \
              --connect-timeout 15 --max-time 30 \
              --retry 2 --retry-delay 5 --retry-max-time 90 \
              --url "https://www.virustotal.com/api/v3/analyses/$ENCODED_ID" \
              --header "x-apikey: $VT_API_KEY")

            STATUS=$(printf '%s' "$RESPONSE" | jq -er '.data.attributes.status | select(. == "queued" or . == "in-progress" or . == "completed")')

            if [ "$STATUS" = "completed" ]; then
              echo "Analysis complete."
              printf '%s' "$RESPONSE" | jq -e '
                .data.attributes.stats |
                type == "object" and length > 0 and
                has("malicious") and has("suspicious") and has("undetected") and
                all(.[]; type == "number" and . >= 0 and . == floor)
              ' >/dev/null

              MALICIOUS=$(echo "$RESPONSE" | jq '.data.attributes.stats.malicious')
              SUSPICIOUS=$(echo "$RESPONSE" | jq '.data.attributes.stats.suspicious')
              UNDETECTED=$(echo "$RESPONSE" | jq '.data.attributes.stats.undetected')

              TOTAL=$(echo "$RESPONSE" | jq '[.data.attributes.stats[]] | add')
              SHA256=$(printf '%s' "$RESPONSE" | jq -er '.meta.file_info.sha256 | select(type == "string") | select(test("^[a-fA-F0-9]{64}$")) | ascii_downcase')
              if [ "$SHA256" != "$EXPECTED_SHA256" ]; then
                echo "::error::VirusTotal report does not match the installer"
                exit 1
              fi

              URL="https://www.virustotal.com/gui/file/$SHA256"

              echo "malicious=$MALICIOUS" >> "$GITHUB_OUTPUT"
              echo "suspicious=$SUSPICIOUS" >> "$GITHUB_OUTPUT"
              echo "undetected=$UNDETECTED" >> "$GITHUB_OUTPUT"
              echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
              echo "url=$URL" >> "$GITHUB_OUTPUT"

              exit 0
            fi

            echo "Still $STATUS — waiting..."
            if [ "$i" -lt 10 ]; then
              sleep 30
            fi
          done

          echo "::error::VirusTotal analysis did not complete in time."
          exit 1

      # 7 Build release notes (ALWAYS updated)
      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TIMESTAMP: ${{ steps.version.outputs.timestamp }}
          VT_UNDETECTED: ${{ steps.vt_report.outputs.undetected }}
          VT_TOTAL: ${{ steps.vt_report.outputs.total }}
          VT_SUSPICIOUS: ${{ steps.vt_report.outputs.suspicious }}
          VT_MALICIOUS: ${{ steps.vt_report.outputs.malicious }}
          VT_URL: ${{ steps.vt_report.outputs.url }}
        run: |
          {
            printf '## Version: %s\n' "$VERSION"
            printf '**Build Timestamp: %sZ**\n<br/>\n' "$TIMESTAMP"
            cat "$RUNNER_TEMP/release-changes.md"
            printf '\n<br/><br/><br/>\n## 🛡️ VirusTotal Scan\n'
            printf -- '- Undetected: %s / %s engine reports\n' "$VT_UNDETECTED" "$VT_TOTAL"
            printf -- '- ⚠️ Suspicious: %s\n' "$VT_SUSPICIOUS"
            printf -- '- ❌ Malicious: %s\n' "$VT_MALICIOUS"
            printf -- '- 🔗 [Full Report](%s)\n' "$VT_URL"
            printf '\nUndetected is not a safety verdict; totals include all reported statuses.\n'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Check release is not stale
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/master
          REMOTE_SHA=$(git rev-parse FETCH_HEAD)
          # Also allow a retry whose generated changelog was already committed.
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ] && ! git diff --quiet "$REMOTE_SHA" --; then
            echo "::error::master changed during this run; publish from its current head instead"
            exit 1
          fi

      # 8 Delete + recreate release (fresh UI timestamp)
      - name: Delete old release
        run: |
          RELEASE_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == "latest") | .id')
          if [ -n "$RELEASE_ID" ]; then
            gh release delete latest -y --cleanup-tag
          fi
          # A previous failed release may have left only the tag behind.
          TAG_REF=$(git ls-remote --tags origin refs/tags/latest)
          if [ -n "$TAG_REF" ]; then
            git push origin :refs/tags/latest
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest Build
          body_path: ${{ runner.temp }}/release-notes.md
          files: PilotsDock-Installer-latest.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Persist cleared CHANGES only after the release succeeds.
      - name: Commit changelog
        if: steps.update_changelog.outputs.updated == 'true'
        run: |
          git add -- CHANGELOG.md CHANGES.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin refs/heads/master
          REMOTE_SHA=$(git rev-parse FETCH_HEAD)
          if git diff --quiet "$REMOTE_SHA" --; then
            echo "Changelog already committed"
            exit 0
          fi
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release succeeded, but master advanced; changelog was not pushed. Reconcile CHANGELOG and CHANGES before retrying."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): update changelog"
          git push origin HEAD:refs/heads/master
